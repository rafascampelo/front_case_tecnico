<mat-card class="auth-card">
  <mat-card-header>
    <mat-card-title>Criar conta</mat-card-title>
    <mat-card-subtitle>Preencha seus dados para começar</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="register()">
      <mat-form-field appearance="outline">
        <mat-label>Nome completo</mat-label>
        <input matInput type="text" autocomplete="name" formControlName="name" />
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" autocomplete="email" formControlName="email" />
        <mat-icon matSuffix>mail</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput type="password" autocomplete="new-password" formControlName="password" />
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      <button mat-flat-button color="primary" class="submit-button">Criar conta</button>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <span>Já tem uma conta?</span>
    <a mat-button routerLink="/login">Entrar</a>
  </mat-card-actions>
</mat-card>
