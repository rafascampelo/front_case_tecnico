<mat-card class="auth-card">
  <mat-card-header>
    <mat-card-title>Entrar</mat-card-title>
    <mat-card-subtitle>Acesse sua conta</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form class="auth-form">
      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" autocomplete="email" />
        <mat-icon matSuffix>mail</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput type="password" autocomplete="current-password" />
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      <button mat-flat-button color="primary" class="submit-button">
        Entrar
      </button>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <span>Ainda não tem conta?</span>
    <a mat-button routerLink="/register">Criar conta</a>
  </mat-card-actions>
</mat-card>
